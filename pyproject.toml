[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deal-sniper"
version = "0.1.0"
description = "Snipe below-median deals from classified listings"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
deal-sniper = "deal_sniper.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["deal_sniper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
